name: App - Testes e deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    paths:
      - "app/**"

jobs:
  test:
    name: Lint e testes (com PostgreSQL de teste)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIVEN_DB_URL: postgres://postgres:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: app
        run: pip install -r requirements.txt pytest flake8

      - name: Lint
        working-directory: app
        run: flake8 . --max-line-length=100

      - name: Testes
        working-directory: app
        run: pytest -v

  deploy:
    name: Deploy no Render e health check
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar o deploy hook do Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Health check pós-deploy (até 5 minutos)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ secrets.APP_HEALTHCHECK_URL }}/healthz"; then
              echo; echo "Aplicação saudável."; exit 0
            fi
            echo "Aguardando a aplicação subir (tentativa $i de 20)..."
            sleep 15
          done
          echo "A aplicação não ficou saudável a tempo."; exit 1
